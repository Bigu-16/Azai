<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Planets - Cinematic Exploration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&amp;family=Space+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00f2ff",
                    },
                    fontFamily: {
                        "headline-xl": ["Newsreader"],
                        "body-md": ["Space Grotesk"],
                        "label-sm": ["Space Grotesk"],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#050810] text-white min-h-screen overflow-hidden relative flex flex-col font-body-md selection:bg-primary/30 selection:text-white">
<!-- Deep Space Background & Starfield -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute inset-0 bg-gradient-to-b from-[#060b14] to-[#020408]"></div>
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&amp;w=3000&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-40 mix-blend-screen" data-alt="deep space starfield background with subtle nebula dust and scattered bright stars"></div>
</div>
<!-- Top Navigation Bar -->
<header class="absolute top-0 left-0 right-0 flex items-center justify-between px-8 py-6 border-b border-white/10 z-[60]">
<!-- Brand -->
<div class="flex items-center gap-2">
<span class="text-lg font-bold tracking-[0.05em] text-primary lowercase">spaceedu</span>
</div>
<!-- Navigation Links -->
<nav class="hidden md:flex items-center gap-10 font-label-sm font-semibold tracking-wide text-sm">
<a class="text-white border-b-2 border-white pb-1" href="#">Planets</a>
<a class="text-white/70 hover:text-white transition-colors" href="#">Trailer</a>
<a class="text-white/70 hover:text-white transition-colors" href="#">Tickets</a>
<a class="text-white/70 hover:text-white transition-colors" href="#">Blog</a>
</nav>
<!-- Trailing Action -->
<div>
<button class="px-6 py-2 bg-white text-black font-label-sm text-sm font-bold rounded-full hover:bg-gray-100 transition-colors">
                Enroll
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative flex-1 flex flex-col items-center w-full max-w-5xl mx-auto pt-32 px-8 min-h-screen z-40">
<!-- Hero Section -->
<div class="flex flex-col items-center text-center mt-12 w-full z-50">
<!-- Pre-title -->
<p class="font-label-sm text-sm text-white tracking-[0.4em] uppercase mb-4">
                PLANET
            </p>
<!-- Main Title -->
<h1 class="font-headline-xl text-[100px] md:text-[140px] leading-none text-white uppercase tracking-wider mb-6 drop-shadow-lg">
                EARTH
            </h1>
<!-- Glowing Divider Line -->
<div class="w-24 h-[3px] bg-primary shadow-[0_0_15px_#00f2ff] mb-8"></div>
<!-- Subtitle -->
<p class="max-w-3xl mx-auto text-white/90 font-label-sm text-sm md:text-base leading-loose mb-12">
                Learn more about this facinating miracle that we call our home, Planet Earth. Course enrollment starts today. Early Bird tickets typically last a week, don't miss out!
            </p>
<!-- Primary CTA -->
<button class="px-8 py-4 bg-white text-black font-label-sm text-xs font-bold uppercase tracking-[0.15em] rounded-full shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:scale-105 transition-transform duration-300">
                GET STARTED
            </button>
</div>
</main>
<!-- Side Navigation Elements (Venus / Mars) -->
<!-- Left Side: Venus -->
<div class="absolute left-0 top-[55%] -translate-y-1/2 flex items-center gap-6 cursor-pointer group z-40">
<div class="w-24 h-24 rounded-full overflow-hidden border border-white/5 -ml-12 shadow-[0_0_20px_rgba(255,255,255,0.05)]">
<img alt="Venus" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbpklZ6yDdlsAFKzdkSGmtTEu6Dwf_LD_BFDeA1QFOk_orPHC3AoAJzv0N26nCd6COvLl8LI_b1f7AztxZmS5FYvjYJ-elqY1xYj6B2viix58Nu6dpXMygnCsYidgtxSwfy4tU5RQ1R_X1or1lW4igVbYxZvm_L4BSXPpcMBsXmMWo_opLuo36XXycyqERviCYrBQtNsH1dzQqoDeGebDLLutAQyu_-XYejbLoFocVI0FLgl7xFV8aF942jFZS6asQwx0UYCvzK_w"/>
</div>
<span class="font-label-sm text-xs tracking-[0.3em] text-white/80 group-hover:text-white transition-colors uppercase">
            VENUS
        </span>
</div>
<!-- Right Side: Mars -->
<div class="absolute right-0 top-[55%] -translate-y-1/2 flex items-center gap-6 cursor-pointer group z-40">
<span class="font-label-sm text-xs tracking-[0.3em] text-white/80 group-hover:text-white transition-colors uppercase">
            MARS
        </span>
<div class="w-24 h-24 rounded-full overflow-hidden border border-white/5 -mr-12 shadow-[0_0_20px_rgba(255,100,100,0.05)]">
<img alt="Mars" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuASegDzRh68dPwPqzEBA30y8My-u4f_dXWNtsorvpOpEh8eLmNNH4SS23dCeYSJSYkcmCUqpi_ciBCmIB1YxC36YcafDxxvb3g0fbEHGJyj4LhNOICWwuEIntnSDmsBASGgnsbT9kS6kJ9WvJG-LQq1E4yRgT6oRITjLwNZyDfIETIavpCrWsjlGukfN5sU2_8M0hzZE5lzkLsDN9YbW0wBeIc9_LeoHsCWgE8g3BMb27OOwm4J9WIsOxHCZb_uTdSD5oMx2hfbsqE"/>
</div>
</div>
<!-- Bottom Visual Anchor: Giant Earth -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[160vw] max-w-[1400px] translate-y-[55%] z-20 pointer-events-none">
<div class="relative w-full aspect-square rounded-full">
<div class="absolute inset-0 rounded-full shadow-[0_0_80px_rgba(0,150,255,0.4)]"></div>
<img alt="Earth" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8d5a7rWXknRFDt6NecifxDbE4c1E_WD6Korcz5_tDyE2QJJ6zvnK6hF_trZvz7wd2aBb7bi0GrKRBbvBfoduR1mSAez8iEwmMim2C4d5EoITHlXhxdscTlshasso5Q2DlPBnOM_ic3UamQo6BN-ReFwomSH7DUjy_gasI3L7Mp8SO1d927ApYsssv4zjlsStsOIRKl-IDvjJKh8gNf7nAiDyR39aa23qTVemOIhm4ukI7tjuCGzTPdUSKWsJiBmHGLwSaGnwL9Fg"/>
</div>
</div>
<!-- Scroll Down Indicator -->
<div class="absolute bottom-12 left-1/2 -translate-x-1/2 z-50 flex items-center justify-center w-14 h-14 bg-black/40 backdrop-blur-md rounded-full border border-white/20 text-white cursor-pointer hover:bg-black/60 transition-colors">
<span class="material-symbols-outlined text-lg">arrow_downward</span>
</div>
</body></html>
